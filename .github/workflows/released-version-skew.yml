name: Released client version skew

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/released-version-skew.yml"
      - "compatibility/released-client-matrix.json"
      - "internal/qualitygate/**"
      - "experiments/semantic-shell/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/released-version-skew.yml"
      - "compatibility/released-client-matrix.json"
      - "internal/qualitygate/**"
      - "experiments/semantic-shell/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.os }} / ${{ matrix.lane }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        lane:
          - previous-client-previous-peer
          - previous-client-current-peer
          - current-client-previous-peer
          - current-client-current-peer
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
      - name: Build and test exact public modules
        run: go run ./internal/qualitygate -mode=released-version-skew -lane=${{ matrix.lane }}
